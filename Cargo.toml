[workspace]
resolver = "2"
members = [
  "crates/nuif-core",
  "crates/nuif-protocol",
  "crates/nuif-cli",
  "crates/nuif-layout",
  "crates/nuif-render",
  "crates/nuif-codec",
  "crates/nuif-query",
  "crates/nuif-api",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.85"
repository = "https://github.com/refpath/nuif"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
