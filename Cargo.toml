[workspace]
resolver = "3"
members = [
  "crates/nuif-core",
  "crates/nuif-protocol",
  "crates/nuif-cli",
  "crates/nuif-layout",
  "crates/nuif-render",
  "crates/nuif-text",
  "crates/nuif-codec",
  "crates/nuif-package",
  "crates/nuif-media",
  "crates/nuif-font",
  "crates/nuif-reconstruct",
  "crates/nuif-capture",
  "crates/nuif-query",
  "crates/nuif-api",
  "crates/nuif-testing",
  "crates/nuif-adapter",
  "crates/nuif-dtcg",
  "crates/nuif-html",
  "crates/nuif-svg",
  "crates/nuif-penpot",
  "crates/nuif-react",
  "crates/nuif-wasm",
  "crates/nuif-mcp",
  "crates/nuif-collab",
  "apps/editor",
  "conformance",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
repository = "https://github.com/refpath/nuif"

[workspace.dependencies]
ciborium = "0.2.2"
criterion = { version = "0.8.2", default-features = false }
font-test-data = "=0.9.1"
harfrust = "=0.13.3"
json5 = "1.3.1"
png = "0.18.0"
rmcp = { version = "=3.1.4", default-features = false, features = ["macros", "server", "transport-io"] }
roxmltree = "=0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = { version = "1.0", features = ["raw_value"] }
serde-saphyr = { version = "=1.1.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10"
skrifa = "=0.46.2"
stats_alloc = "0.1.10"
taffy = "=0.14.0"
thiserror = "2.0"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
tree-sitter = "=0.26.13"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }
wasm-bindgen = "=0.2.127"
zeno = "=0.3.3"
zune-png = { version = "=0.5.2", default-features = false, features = ["std"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
