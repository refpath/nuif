[workspace]
resolver = "3"
members = [
  "crates/nuif-core",
  "crates/nuif-protocol",
  "crates/nuif-cli",
  "crates/nuif-layout",
  "crates/nuif-render",
  "crates/nuif-text",
  "crates/nuif-codec",
  "crates/nuif-query",
  "crates/nuif-api",
  "crates/nuif-testing",
  "crates/nuif-adapter",
  "crates/nuif-html",
  "crates/nuif-svg",
  "crates/nuif-collab",
  "apps/editor",
  "conformance",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
repository = "https://github.com/refpath/nuif"

[workspace.dependencies]
ciborium = "0.2.2"
criterion = { version = "0.8.2", default-features = false }
font-test-data = "=0.7.0"
harfrust = "=0.13.3"
json5 = "0.4.1"
png = "0.18.0"
roxmltree = "=0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
skrifa = "=0.46.2"
stats_alloc = "0.1.10"
taffy = "=0.14.0"
thiserror = "2.0"
tree-sitter = "=0.26.10"
tree-sitter-css = "=0.25.0"
tree-sitter-html = "=0.23.2"
zeno = "=0.3.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
