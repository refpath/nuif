[workspace]
resolver = "3"
members = [
  "crates/nuif-core",
  "crates/nuif-protocol",
  "crates/nuif-cli",
  "crates/nuif-layout",
  "crates/nuif-render",
  "crates/nuif-codec",
  "crates/nuif-query",
  "crates/nuif-api",
  "crates/nuif-testing",
  "apps/editor",
  "conformance",
  "xtask",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
repository = "https://github.com/refpath/nuif"

[workspace.dependencies]
ciborium = "0.2.2"
json5 = "0.4.1"
png = "0.18.0"
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1.0"
sha2 = "0.10"
stats_alloc = "0.1.10"
thiserror = "2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
