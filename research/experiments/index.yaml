version: 1
experiments:
  - id: nuif:experiment:v0-responsive-card
    status: planned
    fixture: conformance/fixtures/v0-responsive-card
    tests:
      - semantic identity retention
      - token binding retention
      - responsive layout fidelity at 360 768 1440
      - opaque extension preservation
      - canonical encoding stability
      - deterministic operation replay
      - minimal source patch after design edit
  - id: nuif:experiment:layout-differential
    status: planned
    tests:
      - compare matching NUIF flex/grid fixtures with Taffy and browser output
      - classify all divergences as schema loss evaluator bug or target semantic difference
  - id: nuif:experiment:layout-inference
    status: planned
    tests:
      - capture the same foreign UI at multiple viewport widths
      - infer candidate stack flex grid constraint and freeform representations
      - rank candidates using held-out viewport predictions
      - retain observations confidence and alternatives as provenance
      - verify inferred intent is never reported as lossless without source evidence
  - id: nuif:experiment:text-pinning
    status: planned
    tests:
      - pin font hashes Unicode data shaping configuration locale and width
      - measure cross-platform shaped-run and raster divergence
  - id: nuif:experiment:codec-benchmark
    status: planned
    tests:
      - canonical text vs deterministic CBOR vs schema-based candidates
      - size encode decode partial-load canonicalize and unknown-data preservation
  - id: nuif:experiment:crdt-checkpoint
    status: planned
    tests:
      - concurrent semantic edits through two collaboration engines
      - canonical checkpoint equality and explicit semantic conflicts
  - id: nuif:experiment:accessibility-mapping
    status: planned
    tests:
      - map portable role name state and relationship fixtures to web ARIA
      - compare exposed browser accessibility trees across engines
      - classify platform differences separately from NUIF semantic loss
  - id: nuif:experiment:behavior-portability
    status: planned
    tests:
      - author bounded state and interaction graphs once
      - execute through reference engine and at least one foreign target adapter
      - verify required optional capability negotiation and deterministic replay
  - id: nuif:experiment:unknown-extension-roundtrip
    status: planned
    evidence: [nuif:research:opentimelineio, nuif:research:godot-tscn-scene-format, nuif:research:gltf-validator-and-sample-assets]
    tests:
      - decode a document containing an unknown entity kind and an unknown extension namespace with an implementation that registers neither
      - apply rename move and property operations to neighbouring entities
      - encode and assert byte identity of the unknown payloads and restoration of the original kind
  - id: nuif:experiment:roundtrip-trial-loop
    status: planned
    evidence: [nuif:research:deterministic-simulation-testing, nuif:research:metamorphic-testing-graphics, nuif:research:delta-debugging-and-test-case-reduction, nuif:research:property-based-testing-state-machines]
    tests:
      - seeded generation of documents and operation logs against an ordered-forest reference model
      - replay inversion commutation and encode fixpoint relations on every trial
      - adapter round trips with fidelity reports on the representable subset
      - three-level reduction of failures into fixture directories
      - one report per run following conformance/HARNESS.md
  - id: nuif:experiment:render-tolerance-tiers
    status: planned
    evidence: [nuif:research:vello-testing-and-cpu-reference, nuif:research:flip-perceptual-difference-metric, nuif:research:resvg-test-suite, nuif:research:gpu-rendering-nondeterminism]
    tests:
      - render the v0 fixture through the CPU reference path and assert pixel identity across operating systems
      - render through the Vello backend and measure FLIP mean and per-channel deltas against the CPU reference
      - assign each visual property to a tier from the measured distributions
  - id: nuif:experiment:editor-harness-parity
    status: planned
    evidence: [nuif:research:masonry-xilem-and-linebender-test-harness, nuif:research:accesskit-semantic-ui-testing, nuif:research:egui-and-egui-kittest]
    tests:
      - author the v0 fixture through the editor session driver using accessibility actions only
      - assert the emitted operation log replays to the same canonical hash as the CLI-authored fixture
      - assert the accessibility tree exposes entity identifiers for every bound widget
