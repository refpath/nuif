    implementation: [crates/nuif-testing/src/bin/codec-benchmark.rs, xtask/src/main.rs, .github/workflows/ci.yml]
    oracle: measured-benchmark
    continuation:
      class: continuous-measurement
      blocked_by:
        - candidate codecs are inadmissible until a complete semantic and opaque-data mapping passes the existing preflight
        - timing results require controlled hardware and are observations rather than a one-time format-completion gate
      next_action: Admit and measure the next complete candidate mapping only when it preserves the same canonical and unknown-data laws.
    acceptance:
      - corpus seed hardware toolchain and warmup protocol are recorded
      - every candidate passes unknown-data and canonical fixpoint checks before timing
    tests:
      - measure canonical text and deterministic CBOR at 8 64 512 and 4096 entities only after conformance preflight
      - record size encode decode canonicalize allocation and decode-then-select costs without mislabeling full decode as native partial load
      - require exact semantic canonical and opaque-data preservation fixpoints before timing a codec
      - keep Protobuf and FlatBuffers unadmitted and Cap'n Proto next-candidate until a complete semantic mapping passes the same preflight
      - write and archive target/codec-benchmark-report.json
