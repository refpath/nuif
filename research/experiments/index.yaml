    status: planned
    tests:
      - pin font hashes Unicode data shaping configuration locale and width
      - measure cross-platform shaped-run and raster divergence
  - id: nuif:experiment:codec-benchmark
    status: planned
    tests:
      - canonical text vs deterministic CBOR vs schema-based candidates
      - size encode decode partial-load canonicalize and unknown-data preservation
  - id: nuif:experiment:crdt-checkpoint
    status: planned
    tests:
      - concurrent semantic edits through two collaboration engines
      - canonical checkpoint equality and explicit semantic conflicts
