principles:
  - id: nuif:claim:multi-level-ir
    statement: A portable authored-interface standard requires multiple coordinated semantic levels rather than a single scene tree.
  - id: nuif:claim:authored-resolved
    statement: Authored intent and resolved evaluation state must both be representable.
  - id: nuif:claim:sync-not-regenerate
    statement: Round-trip portability should use correspondence, provenance, diff and patch rather than whole-project regeneration.
  - id: nuif:claim:opaque-preservation
    statement: Unknown vendor or dialect data should survive transit whenever structural preservation is possible.
  - id: nuif:claim:collab-profile
    statement: Collaboration state should be layered above the canonical document rather than defining the canonical document.
  - id: nuif:claim:semantic-automation
    statement: CLI and API semantics are normative test surfaces; GUI automation is supplementary.
  - id: nuif:claim:canonical-type-preservation
    statement: Canonical encodings must preserve logical value kinds without relying on an unavailable external schema.
  - id: nuif:claim:bounded-untrusted-input
    statement: Untrusted interchange requires encoded byte, syntax depth and semantic cardinality limits calibrated by adversarial time and allocation measurements.
  - id: nuif:claim:resource-identity-separation
    statement: Stable semantic asset identity, immutable resource-byte identity, package location and source provenance are separate concerns and must not be conflated.
  - id: nuif:claim:source-inference-separation
    statement: Source-backed capture and screenshot-only reconstruction are distinct evidence classes; visual agreement alone cannot establish authored equivalence.
  - id: nuif:claim:typed-reconstruction-loop
    statement: Learned reconstruction components should propose bounded typed operations whose validity and rendered outcomes are decided by deterministic core services.
  - id: nuif:claim:evaluation-before-adaptation
    statement: A frozen leak-resistant benchmark and untuned baseline must precede fine-tuning, low-rank adaptation or distillation.
  - id: nuif:claim:calibrated-inference
    statement: Inference confidence must be calibrated against typed correctness events and support explicit abstention rather than forced guesses.
  - id: nuif:claim:model-artifact-separation
    statement: Models, processors, training datasets and task adapters are separately versioned optional artifacts and never redefine the NUIF core or document format.
