# cargo-deny configuration (ADR 0006, section Licensing).
[graph]
all-features = true

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "BSL-1.0",
  "CC0-1.0",
  "0BSD",
  "Unlicense",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
skip-tree = [
  { crate = "masonry@0.4.0", reason = "pinned native GUI stack owns its transitive versions" },
  { crate = "masonry_testing@0.4.0", reason = "pinned GUI test stack owns its transitive versions" },
  { crate = "masonry_winit@0.4.0", reason = "pinned native window stack owns its platform versions" },
  { crate = "rfd@0.17.2", reason = "cross-platform file dialogs own their platform versions" },
]

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/refpath/ui-events",
  "https://github.com/refpath/xilem",
]
