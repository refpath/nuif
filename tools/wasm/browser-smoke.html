<!doctype html>
<html lang="en" data-status="pending">
  <head>
    <meta charset="utf-8">
    <title>NUIF WebAssembly smoke test</title>
  </head>
  <body>
    <pre id="result">pending</pre>
    <script type="module">
      import init, { NuifDocument, apiVersion, capabilities } from "./nuif.js";
      import { packageBytes, expected } from "./browser-fixture.js";

      const result = document.querySelector("#result");
      const canonicalJson = (value) => {
        if (Array.isArray(value)) return value.map(canonicalJson);
        if (value !== null && typeof value === "object") {
          return Object.fromEntries(
            Object.keys(value).sort().map((key) => [key, canonicalJson(value[key])]),
          );
        }
        return value;
      };
      try {
        await init();
        const contract = JSON.parse(
          new TextDecoder().decode(capabilities()),
        );
        if (
          apiVersion() !==
            `${contract.api_profile}/${contract.binding_version}` ||
          contract.api_profile !== "nuif-wasm-api-0" ||
          !contract.containers.includes("nuif-package-0") ||
          typeof NuifDocument.fromPackage !== "function" ||
          contract.authorities.length !== 0
        ) {
          throw new Error("generated browser contract does not match its profile");
        }
        const supported = new TextEncoder().encode(JSON.stringify([
          "nuif-opentype-variable-truetype-single-0",
        ]));
        const variable = NuifDocument.fromPackageWithCapabilities(
          packageBytes,
          supported,
        );
        const observed = JSON.parse(
          new TextDecoder().decode(variable.snapshotReport(640, 96)),
        );
        variable.free();
        if (
          JSON.stringify(canonicalJson(observed)) !==
          JSON.stringify(canonicalJson(expected))
        ) {
          throw new Error("browser WASM snapshot diverged from the CLI report");
        }
        document.documentElement.dataset.status = "passed";
        result.textContent = JSON.stringify({
          status: "passed",
          api_profile: contract.api_profile,
          variable_font_hash: observed.canonical_hash,
          variable_font_raster_sha256: observed.raster.rgba_sha256,
        });
      } catch (error) {
        document.documentElement.dataset.status = "failed";
        result.textContent = String(error?.stack ?? error);
      }
    </script>
  </body>
</html>
