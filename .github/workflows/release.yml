name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    name: validate release source
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.20.0"
          package-manager-cache: false
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Validate the tag and source version
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Run the complete verification harness
        run: cargo xtask all
      - name: Audit dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification
          if-no-files-found: error
          retention-days: 14
          path: |
            target/dist/release-check.json
            target/verification-manifest.json
            target/workflow-audit-report.json
            target/research-readiness-report.json
            target/adapter-coverage-report.json
            target/dependency-audit-report.json
            target/diagnostic-registry-report.json
            target/performance-profile-report.json
            target/package-resources-report.json
            target/image-resources-report.json
            target/font-resources-report.json
            target/variable-font-metadata-report.json
            target/variable-font-shaping-report.json
            target/variable-font-metrics-report.json
            target/variable-font-global-metrics-report.json
            target/variable-font-security-report.json
            target/variable-font-package-report.json
            target/variable-font-corpus-report.json
            target/variable-font-gvar-generated-report.json
            target/variable-font-runtime-report.json
            target/variable-font-surface-report.json
            target/capture-reconstruction-report.json
            target/reconstruction-provider-manifest-report.json
            target/reconstruction-corpus-audit-report.json
            target/reconstruction-evaluation-report.json
            target/live-browser-capture-report.json
            target/react-sync-report.json
            target/svelte-sync-report.json
            target/svelte-compiler-oracle-report.json
            target/figma-snapshot-report.json
            target/figma-plugin-shell-report.json
            target/figma-plugin-fixture-snapshot.json
            target/figma-plugin-fixture.nuif.json
            target/figma-plugin-fixture-report.json
            target/figma-plugin-plan-validation.json
            target/nuif-figma-plugin-review-shell
            target/canva-current-page-report.json
            target/canva-app-shell-report.json
            target/canva-app-fixture.nuif.json
            target/canva-app-fixture-page.json
            target/canva-app-fixture-imported.nuif.json
            target/canva-app-fixture-report.json
            target/canva-app-plan.json
            target/canva-app-plan-report.json
            target/canva-app-plan-validation.json
            target/canva-app-benchmark-report.json
            target/nuif-canva-review-app
            target/ffi-header-report.json
            target/ffi-symbol-report.json
            target/ffi-variable-font-report.json
            target/ffi-variable-font-sanitized-report.json
            target/wasm-conformance-report.json
            target/mcp-conformance-report.json
            target/editor-gui-trial/report.json

  package:
    needs: validate
    name: package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # mint the OIDC identity used for package attestations
      attestations: write # publish package attestations for this repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Validate the tag and source version
        shell: bash
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Test the native editor
        run: cargo test -p nuif-editor --all-targets --all-features --locked
      - name: Exercise the tagged user-scoped alpha installation
        run: cargo xtask editor-install-trial --channel alpha
      - name: Build and verify the native package
        env:
          NUIF_BUILD_NUMBER: ${{ github.run_number }}
        run: cargo xtask editor-package
      - name: Build the experimental C ABI developer package
        run: cargo xtask ffi-package
      - name: Locate release assets
        id: assets
        shell: bash
        run: |
          archive=$(find target/dist -maxdepth 1 -type f -name 'nuif-editor-*' \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          manifest=$(find target/dist -maxdepth 1 -type f -name 'nuif-editor-*.manifest.json' -print -quit)
          ffi_archive=$(find target/dist -maxdepth 1 -type f -name 'nuif-ffi-*' \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          ffi_manifest=$(find target/dist -maxdepth 1 -type f -name 'nuif-ffi-*.manifest.json' -print -quit)
          test -n "$archive"
          test -n "$manifest"
          test -n "$ffi_archive"
          test -n "$ffi_manifest"
          {
            printf 'archive=%s\n' "$archive"
            printf 'manifest=%s\n' "$manifest"
            printf 'ffi_archive=%s\n' "$ffi_archive"
            printf 'ffi_manifest=%s\n' "$ffi_manifest"
          } >> "$GITHUB_OUTPUT"
      - name: Validate macOS bundle metadata
        if: runner.os == 'macOS'
        shell: bash
        run: plutil -lint target/dist/nuif-editor-*/NUIF\ Editor.app/Contents/Info.plist
      - name: Attest native package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
            ${{ steps.assets.outputs.ffi_archive }}
            ${{ steps.assets.outputs.ffi_manifest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
            ${{ steps.assets.outputs.ffi_archive }}
            ${{ steps.assets.outputs.ffi_manifest }}

  wasm-package:
    needs: validate
    name: package (wasm-web)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # mint the OIDC identity used for package attestations
      attestations: write # publish package attestations for this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Install Linux native dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Validate the tag and source version
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Build and cross-check the browser package
        run: cargo xtask wasm-package
      - name: Locate binding assets
        id: assets
        run: |
          archive=$(find target/dist -maxdepth 1 -type f -name 'nuif-wasm-*-web.tar.gz' -print -quit)
          manifest=$(find target/dist -maxdepth 1 -type f -name 'nuif-wasm-*-web.binding.json' -print -quit)
          test -n "$archive"
          test -n "$manifest"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Attest WebAssembly package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-wasm-package
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}

  mcp-package:
    needs: validate
    name: package MCP (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # mint the OIDC identity used for package attestations
      attestations: write # publish package attestations for this repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Validate the tag and source version
        shell: bash
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Build, live-test, and package the MCP developer tool
        run: cargo xtask mcp-package
      - name: Locate MCP assets
        id: assets
        shell: bash
        run: |
          archive=$(find target/dist -maxdepth 1 -type f -name 'nuif-mcp-*' \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          manifest=$(find target/dist -maxdepth 1 -type f -name 'nuif-mcp-*.manifest.json' -print -quit)
          test -n "$archive"
          test -n "$manifest"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Attest MCP package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-mcp-package-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}

  cli-package:
    needs: validate
    name: package CLI (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # mint the OIDC identity used for package attestations
      attestations: write # publish package attestations for this repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Validate the tag and source version
        shell: bash
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Build, exercise, and package the standalone CLI
        run: cargo xtask cli-package
      - name: Locate CLI assets
        id: assets
        shell: bash
        run: |
          archive=$(find target/dist -maxdepth 1 -type f -name 'nuif-cli-*' \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          manifest=$(find target/dist -maxdepth 1 -type f -name 'nuif-cli-*.manifest.json' -print -quit)
          test -n "$archive"
          test -n "$manifest"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Attest CLI package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-cli-package-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}

  conformance-kit:
    needs: validate
    name: package conformance kit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # mint the OIDC identity used for package attestations
      attestations: write # publish package attestations for this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Validate the tag and source version
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Build the external conformance kit
        run: cargo xtask conformance-kit
      - name: Locate conformance kit assets
        id: assets
        shell: bash
        run: |
          archive=$(find target/dist -maxdepth 1 -type f -name 'nuif-conformance-kit-*' \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          manifest=$(find target/dist -maxdepth 1 -type f -name 'nuif-conformance-kit-*.manifest.json' -print -quit)
          test -n "$archive"
          test -n "$manifest"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Attest conformance kit
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-conformance-kit
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}

  publish:
    name: publish prerelease
    needs: [package, wasm-package, mcp-package, cli-package, conformance-kit]
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub prerelease and upload its assets
      id-token: write # mint the OIDC identity used for release-index attestations
      attestations: write # publish SBOM and release-index attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-wasm-package
          path: release-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-mcp-package-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-cli-package-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-conformance-kit
          path: release-assets
      - name: Generate release SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          tool_archive=target/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz
          tool_dir=target/cargo-cyclonedx
          mkdir -p "$tool_dir"
          gh release download cargo-cyclonedx-0.5.9 \
            --repo CycloneDX/cyclonedx-rust-cargo \
            --pattern 'cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz' \
            --output "$tool_archive"
          printf '%s  %s\n' \
            fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8 \
            "$tool_archive" | sha256sum -c -
          gh attestation verify "$tool_archive" \
            --repo CycloneDX/cyclonedx-rust-cargo
          tar -xJf "$tool_archive" -C "$tool_dir" --strip-components=1
          source_date_epoch=$(git show -s --format=%ct HEAD)
          SOURCE_DATE_EPOCH=$source_date_epoch \
            "$tool_dir/cargo-cyclonedx" cyclonedx \
              --manifest-path apps/editor/Cargo.toml \
              --format json \
              --target all \
              --override-filename "nuif-editor-${version}" \
              --spec-version 1.5 \
              --no-build-deps
          jq --arg root "$GITHUB_WORKSPACE" \
            'walk(if type == "string" then (split($root) | join("/src")) else . end)' \
            "apps/editor/nuif-editor-${version}.json" \
            > "release-assets/nuif-editor-${version}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.version == $version' \
            --arg version "$version" \
            "release-assets/nuif-editor-${version}.cdx.json"
          mcp_version=$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "nuif-mcp") | .version')
          SOURCE_DATE_EPOCH=$source_date_epoch \
            "$tool_dir/cargo-cyclonedx" cyclonedx \
              --manifest-path crates/nuif-mcp/Cargo.toml \
              --format json \
              --target all \
              --override-filename "nuif-mcp-${mcp_version}" \
              --spec-version 1.5 \
              --no-build-deps
          jq --arg root "$GITHUB_WORKSPACE" \
            'walk(if type == "string" then (split($root) | join("/src")) else . end)' \
            "crates/nuif-mcp/nuif-mcp-${mcp_version}.json" \
            > "release-assets/nuif-mcp-${mcp_version}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.version == $version' \
            --arg version "$mcp_version" \
            "release-assets/nuif-mcp-${mcp_version}.cdx.json"
          cli_version=$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "nuif-cli") | .version')
          SOURCE_DATE_EPOCH=$source_date_epoch \
            "$tool_dir/cargo-cyclonedx" cyclonedx \
              --manifest-path crates/nuif-cli/Cargo.toml \
              --format json \
              --target all \
              --override-filename "nuif-cli-${cli_version}" \
              --spec-version 1.5 \
              --no-build-deps
          jq --arg root "$GITHUB_WORKSPACE" \
            'walk(if type == "string" then (split($root) | join("/src")) else . end)' \
            "crates/nuif-cli/nuif-cli-${cli_version}.json" \
            > "release-assets/nuif-cli-${cli_version}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.version == $version' \
            --arg version "$cli_version" \
            "release-assets/nuif-cli-${cli_version}.cdx.json"
          ffi_version=$(cargo metadata --locked --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "nuif-ffi") | .version')
          SOURCE_DATE_EPOCH=$source_date_epoch \
            "$tool_dir/cargo-cyclonedx" cyclonedx \
              --manifest-path crates/nuif-ffi/Cargo.toml \
              --format json \
              --target all \
              --override-filename "nuif-ffi-${ffi_version}" \
              --spec-version 1.5 \
              --no-build-deps
          jq --arg root "$GITHUB_WORKSPACE" \
            'walk(if type == "string" then (split($root) | join("/src")) else . end)' \
            "crates/nuif-ffi/nuif-ffi-${ffi_version}.json" \
            > "release-assets/nuif-ffi-${ffi_version}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.version == $version' \
            --arg version "$ffi_version" \
            "release-assets/nuif-ffi-${ffi_version}.cdx.json"
      - name: Assemble checksums and release manifest
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          revision=$(git rev-parse HEAD)
          cd release-assets
          test "$(find . -maxdepth 1 -type f -name 'nuif-editor-*' \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-wasm-*-web.tar.gz' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -type f -name 'nuif-editor-*.manifest.json' | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-ffi-*' \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-ffi-*.manifest.json' | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-mcp-*' \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-mcp-*.manifest.json' | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-cli-*' \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-cli-*.manifest.json' | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name 'nuif-conformance-kit-*' \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -type f -name 'nuif-conformance-kit-*.manifest.json' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -type f -name '*.binding.json' | wc -l | tr -d ' ')" = 1
          test -f "nuif-editor-${version}.cdx.json"
          test "$(find . -maxdepth 1 -type f -name 'nuif-mcp-*.cdx.json' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -type f -name 'nuif-cli-*.cdx.json' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -type f -name 'nuif-ffi-*.cdx.json' | wc -l | tr -d ' ')" = 1
          kit_manifest=$(find . -maxdepth 1 -type f -name 'nuif-conformance-kit-*.manifest.json' -print -quit)
          jq -e --arg revision "$revision" '
            .schema_version == 1 and
            .status == "passed" and
            .name == "nuif-conformance-kit" and
            .profile == "nuif-conformance-kit-0" and
            .source_revision == $revision and
            .source_dirty == false and
            .scope.certification == "not-claimed" and
            (.files | length > 0) and
            all(.files[]; (.bytes > 0) and (.sha256 | test("^[0-9a-f]{64}$"))) and
            (.archive.sha256 | test("^[0-9a-f]{64}$"))
          ' "$kit_manifest"
          kit_archive=$(jq -r '.archive.name' "$kit_manifest")
          case "$kit_archive" in
            nuif-conformance-kit-*.tar.gz|nuif-conformance-kit-*.zip) ;;
            *) printf 'unsafe conformance kit archive name: %s\n' "$kit_archive" >&2; exit 1 ;;
          esac
          test -f "$kit_archive"
          test "$(sha256sum "$kit_archive" | cut -d ' ' -f 1)" = "$(jq -r '.archive.sha256' "$kit_manifest")"
          mcp_sbom=$(find . -maxdepth 1 -type f -name 'nuif-mcp-*.cdx.json' -printf '%f\n' -quit)
          cli_sbom=$(find . -maxdepth 1 -type f -name 'nuif-cli-*.cdx.json' -printf '%f\n' -quit)
          ffi_sbom=$(find . -maxdepth 1 -type f -name 'nuif-ffi-*.cdx.json' -printf '%f\n' -quit)
          binding=$(find . -maxdepth 1 -type f -name '*.binding.json' -print -quit)
          jq -e --arg revision "$revision" '
            .schema_version == 1 and
            .status == "passed" and
            .name == "@refpath/nuif-wasm" and
            .api_profile == "nuif-wasm-api-0" and
            .target == "web" and
            .source_revision == $revision and
            .source_dirty == false and
            (.files | length == 8) and
            all(.files[]; (.name | type == "string") and (.bytes > 0) and (.sha256 | test("^[0-9a-f]{64}$")))
          ' "$binding"
          binding_archive=$(jq -r '.archive.name' "$binding")
          case "$binding_archive" in
            nuif-wasm-*-web.tar.gz) ;;
            *) printf 'unsafe WebAssembly archive name: %s\n' "$binding_archive" >&2; exit 1 ;;
          esac
          test -f "$binding_archive"
          test "$(sha256sum "$binding_archive" | cut -d ' ' -f 1)" = "$(jq -r '.archive.sha256' "$binding")"
          for service in ./nuif-mcp-*.manifest.json; do
            jq -e --arg revision "$revision" '
              .schema_version == 1 and
              .status == "passed" and
              .name == "nuif-mcp" and
              .api_profile == "nuif-mcp-tools-0" and
              .protocol_version == "2026-07-28" and
              .source_revision == $revision and
              .source_dirty == false and
              .authorities == [] and
              (.binary.sha256 | test("^[0-9a-f]{64}$")) and
              (.archive.sha256 | test("^[0-9a-f]{64}$"))
            ' "$service"
            service_archive=$(jq -r '.archive.name' "$service")
            case "$service_archive" in
              nuif-mcp-*.tar.gz|nuif-mcp-*.zip) ;;
              *) printf 'unsafe MCP archive name: %s\n' "$service_archive" >&2; exit 1 ;;
            esac
            test -f "$service_archive"
            test "$(sha256sum "$service_archive" | cut -d ' ' -f 1)" = "$(jq -r '.archive.sha256' "$service")"
          done
          for tool in ./nuif-cli-*.manifest.json; do
            jq -e --arg revision "$revision" '
              .schema_version == 1 and
              .status == "passed" and
              .name == "nuif-cli" and
              .api_profile == "nuif-cli-tools-0" and
              .source_revision == $revision and
              .source_dirty == false and
              .smoke.status == "passed" and
              .authorities == ["caller-selected-filesystem-paths", "stdin-stdout-stderr"] and
              (.commands | index("validate") != null) and
              (.commands | index("canonicalize") != null) and
              (.binary.sha256 | test("^[0-9a-f]{64}$")) and
              (.archive.sha256 | test("^[0-9a-f]{64}$"))
            ' "$tool"
            tool_archive=$(jq -r '.archive.name' "$tool")
            case "$tool_archive" in
              nuif-cli-*.tar.gz|nuif-cli-*.zip) ;;
              *) printf 'unsafe CLI archive name: %s\n' "$tool_archive" >&2; exit 1 ;;
            esac
            test -f "$tool_archive"
            test "$(sha256sum "$tool_archive" | cut -d ' ' -f 1)" = "$(jq -r '.archive.sha256' "$tool")"
          done
          for ffi in ./nuif-ffi-*.manifest.json; do
            jq -e --arg revision "$revision" '
              .schema_version == 1 and
              .status == "passed" and
              .name == "nuif-ffi" and
              .api_profile == "nuif-ffi-0" and
              .source_revision == $revision and
              .source_dirty == false and
              .stability == "experimental; not ABI-stable" and
              .header.path == "include/nuif_ffi.h" and
              .header.generator == "cbindgen 0.29.4" and
              .header.config == "abi/cbindgen.toml" and
              .symbol_baseline.path == "abi/nuif_ffi.symbols" and
              .symbol_baseline.status == "experimental" and
              .examples.c == "examples/header-smoke.c" and
              .examples.cplusplus == "examples/header-smoke.cpp" and
              .examples.swift == "examples/swift-smoke.swift" and
              .evidence.directory == "evidence" and
              (.files | length > 0) and
              ((.files | map(.path)) | index("abi/cbindgen.toml") != null) and
              ((.files | map(.path)) | index("examples/swift-smoke.swift") != null) and
              all(.files[]; (.bytes > 0) and (.sha256 | test("^[0-9a-f]{64}$"))) and
              (.archive.sha256 | test("^[0-9a-f]{64}$"))
            ' "$ffi"
            ffi_archive=$(jq -r '.archive.name' "$ffi")
            case "$ffi_archive" in
              nuif-ffi-*.tar.gz|nuif-ffi-*.zip) ;;
              *) printf 'unsafe C ABI archive name: %s\n' "$ffi_archive" >&2; exit 1 ;;
            esac
            test -f "$ffi_archive"
            test "$(sha256sum "$ffi_archive" | cut -d ' ' -f 1)" = "$(jq -r '.archive.sha256' "$ffi")"
          done
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.manifest.json' -o -name '*.binding.json' -o -name '*.cdx.json' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          jq -s \
            --arg version "$version" \
            --arg tag "$RELEASE_TAG" \
            --arg revision "$revision" \
            --arg mcp_sbom "$mcp_sbom" \
            --arg cli_sbom "$cli_sbom" \
            --arg ffi_sbom "$ffi_sbom" \
            '{schema_version: 1, version: $version, tag: $tag, source_revision: $revision, sbom: ("nuif-editor-" + $version + ".cdx.json"), sboms: {editor: ("nuif-editor-" + $version + ".cdx.json"), mcp: $mcp_sbom, cli: $cli_sbom, ffi: $ffi_sbom}, packages: .}' \
            ./nuif-editor-*.manifest.json > release-manifest.json
          jq --slurpfile bindings ./nuif-wasm-*-web.binding.json \
            '. + {bindings: $bindings}' \
            release-manifest.json > release-manifest.with-bindings.json
          jq --slurpfile services ./nuif-mcp-*.manifest.json \
            '. + {services: $services}' \
            release-manifest.with-bindings.json > release-manifest.with-services.json
          jq --slurpfile tools ./nuif-cli-*.manifest.json \
            '. + {tools: $tools}' \
            release-manifest.with-services.json > release-manifest.with-tools.json
          jq --slurpfile ffi ./nuif-ffi-*.manifest.json \
            '. + {ffi: $ffi}' \
            release-manifest.with-tools.json > release-manifest.with-ffi.json
          jq --slurpfile conformance ./nuif-conformance-kit-*.manifest.json \
            '. + {conformance: $conformance}' \
            release-manifest.with-ffi.json > release-manifest.with-conformance.json
          rm release-manifest.with-bindings.json
          rm release-manifest.with-services.json
          rm release-manifest.with-tools.json
          rm release-manifest.with-ffi.json
          mv release-manifest.with-conformance.json release-manifest.json
      - name: Attest release index
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
            release-assets/*.cdx.json
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          notes="docs/releases/${version}.md"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/tmp/release-draft 2>/dev/null; then
            test "$(cat /tmp/release-draft)" = true
            gh release edit "$RELEASE_TAG" --title "NUIF Editor ${version}" --notes-file "$notes" --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "NUIF Editor ${version}" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
