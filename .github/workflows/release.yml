name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
      - name: Validate the tag and source version
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Run the complete verification harness
        run: cargo xtask all
      - name: Audit dependency advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/upload-artifact@v7
        with:
          name: release-verification
          if-no-files-found: error
          retention-days: 14
          path: |
            target/dist/release-check.json
            target/verification-manifest.json
            target/performance-profile-report.json
            target/editor-gui-trial/report.json

  package:
    needs: validate
    name: package (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-24.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-x86_64
            runner: windows-2025
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy --component rustfmt
          rustup default 1.98.0
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev
      - name: Validate the tag and source version
        shell: bash
        run: cargo xtask release-check "$RELEASE_TAG"
      - name: Test the native editor
        run: cargo test -p nuif-editor --all-targets --all-features --locked
      - name: Build and verify the native package
        env:
          NUIF_BUILD_NUMBER: ${{ github.run_number }}
        run: cargo xtask editor-package
      - name: Locate release assets
        id: assets
        shell: bash
        run: |
          archive=$(find target/dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print -quit)
          manifest=$(find target/dist -maxdepth 1 -type f -name 'nuif-editor-*.manifest.json' -print -quit)
          test -n "$archive"
          test -n "$manifest"
          printf 'archive=%s\n' "$archive" >> "$GITHUB_OUTPUT"
          printf 'manifest=%s\n' "$manifest" >> "$GITHUB_OUTPUT"
      - name: Validate macOS bundle metadata
        if: runner.os == 'macOS'
        shell: bash
        run: plutil -lint target/dist/nuif-editor-*/NUIF\ Editor.app/Contents/Info.plist
      - name: Attest native package
        uses: actions/attest@v4
        with:
          subject-path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ steps.assets.outputs.archive }}
            ${{ steps.assets.outputs.manifest }}

  publish:
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Install the pinned Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true
      - name: Generate the editor SBOM
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          tool_archive=target/cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz
          tool_dir=target/cargo-cyclonedx
          mkdir -p "$tool_dir"
          gh release download cargo-cyclonedx-0.5.9 \
            --repo CycloneDX/cyclonedx-rust-cargo \
            --pattern 'cargo-cyclonedx-x86_64-unknown-linux-gnu.tar.xz' \
            --output "$tool_archive"
          printf '%s  %s\n' \
            fb8dbee9f182173e062a64a387b21a0badc6fab8b2abf9294973f012972bf6d8 \
            "$tool_archive" | sha256sum -c -
          gh attestation verify "$tool_archive" \
            --repo CycloneDX/cyclonedx-rust-cargo
          tar -xJf "$tool_archive" -C "$tool_dir" --strip-components=1
          source_date_epoch=$(git show -s --format=%ct HEAD)
          SOURCE_DATE_EPOCH=$source_date_epoch \
            "$tool_dir/cargo-cyclonedx" cyclonedx \
              --manifest-path apps/editor/Cargo.toml \
              --format json \
              --target all \
              --override-filename "nuif-editor-${version}" \
              --spec-version 1.5 \
              --no-build-deps
          jq --arg root "$GITHUB_WORKSPACE" \
            'walk(if type == "string" then (split($root) | join("/src")) else . end)' \
            "apps/editor/nuif-editor-${version}.json" \
            > "release-assets/nuif-editor-${version}.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .metadata.component.version == $version' \
            --arg version "$version" \
            "release-assets/nuif-editor-${version}.cdx.json"
      - name: Assemble checksums and release manifest
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          revision=$(git rev-parse HEAD)
          cd release-assets
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l | tr -d ' ')" = 5
          test "$(find . -maxdepth 1 -type f -name '*.manifest.json' | wc -l | tr -d ' ')" = 5
          test -f "nuif-editor-${version}.cdx.json"
          find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.manifest.json' -o -name '*.cdx.json' \) -print0 \
            | sort -z \
            | xargs -0 sha256sum \
            | sed 's#  \./#  #' > SHA256SUMS
          jq -s \
            --arg version "$version" \
            --arg tag "$RELEASE_TAG" \
            --arg revision "$revision" \
            '{schema_version: 1, version: $version, tag: $tag, source_revision: $revision, sbom: ("nuif-editor-" + $version + ".cdx.json"), packages: .}' \
            ./*.manifest.json > release-manifest.json
      - name: Attest release index
        uses: actions/attest@v4
        with:
          subject-path: |
            release-assets/SHA256SUMS
            release-assets/release-manifest.json
            release-assets/*.cdx.json
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=${RELEASE_TAG#v}
          notes="docs/releases/${version}.md"
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft >/tmp/release-draft 2>/dev/null; then
            test "$(cat /tmp/release-draft)" = true
            gh release edit "$RELEASE_TAG" --title "NUIF Editor ${version}" --notes-file "$notes" --prerelease
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease \
              --title "NUIF Editor ${version}" --notes-file "$notes"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
