name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${{ github.event.before }}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          tools/git/commit-lint.sh "$range"

  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate research records
        run: |
          pip install --quiet --requirement tools/research/requirements.txt
          tools/research/validate.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Seeded conformance trial
        run: cargo run --locked -p nuif-cli -- trial 24301 100
      - name: Gate B high-volume replay and codec trial
        run: cargo run --locked -p nuif-cli -- trial 24301 10000 100
      - name: Hostile-input resource trial
        run: cargo xtask hostile-inputs
      - name: Upload hostile-input measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostile-input-report
          path: target/hostile-input-report.json
      - name: Install pinned browser oracle
        run: cargo xtask browser-install
      - name: Gate C browser and Taffy differential trial
        run: cargo xtask gate-c
      - name: Upload layout differential report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-differential-report
          path: target/layout-differential-report.json
      - name: Gate D pinned text-shaping trial
        run: cargo xtask gate-d-text
      - name: Upload text pinning report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: text-pinning-report
          path: target/text-pinning-report.json
      - name: Headless editor trial
        run: |
          cargo run --locked -p nuif-cli -- fixture v0-responsive-card "$RUNNER_TEMP/v0.nuif"
          cargo run --locked -p nuif-editor -- --headless --script conformance/fixtures/v0-responsive-card/editor-trial.jsonl --document "$RUNNER_TEMP/v0.nuif" --output "$RUNNER_TEMP/edited.nuif"
          cargo run --locked -p nuif-cli -- validate "$RUNNER_TEMP/edited.nuif"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.96.0
      - name: Check at rust-version
        run: cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources
